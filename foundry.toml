[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "shanghai"
via_ir = true
gas_limit = 4000000000

[fuzz]
runs = 128

[invariant]
runs = 32
depth = 20
fail_on_revert = false

[rpc_endpoints]
bsc = "https://bsc-dataseed.bnbchain.org"
bsc_public = "https://bsc.publicnode.com"
bsc_defibit = "https://bsc-dataseed1.defibit.io"
bsc_testnet = "https://bsc-testnet-rpc.publicnode.com"
